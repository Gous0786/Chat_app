# Template only — DO NOT fill this in and commit it.
#
# The recommended way to create the real secret is imperatively, so the
# values never touch a file on disk in the repo at all:
#
#   kubectl create secret generic chat-app-secrets \
#     --namespace chat-app \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="<a-real-password>"
#
# If you'd rather apply a YAML file, copy this to 01-secret.yaml (that exact
# name is gitignored — see .gitignore), fill in real base64 values, and
# `kubectl apply -f k8s/01-secret.yaml`.
# Encode a value with:  echo -n 'the-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: chat-app-secrets
  namespace: chat-app
type: Opaque
data:
  JWT_SECRET_KEY: <base64-encoded-32plus-char-secret>
  MYSQL_ROOT_PASSWORD: <base64-encoded-password>
