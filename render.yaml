# Render Blueprint for the backend (Render → New → Blueprint → pick this repo).
# The database is external (Render has no free MySQL); see DEPLOYMENT.md.
# Values marked `sync: false` are prompted for in the Render dashboard and
# never stored in git.
services:
  - type: web
    name: chat-app-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render routes traffic to $PORT; make the app listen on the same port.
      - key: PORT
        value: "5454"
      - key: SERVER_PORT
        value: "5454"

      # External MySQL (e.g. Aiven free tier, which requires TLS):
      # jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # The prod profile says `validate`, which fails on an empty database.
      # `update` creates the schema on first boot (with AUTO_INCREMENT ids).
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # Free MySQL plans allow few connections; the prod default of 20 is too many.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"

      # Random 256-bit secret generated by Render on first deploy.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRATION_TIME
        value: "86400000"

      # Exact Vercel URL, e.g. https://chat-app.vercel.app (no trailing slash).
      # CORS and the WebSocket handshake reject every other origin.
      - key: FRONTEND_ORIGIN
        sync: false

      # Free instances have 512 MB. JVM defaults would use only 128 MB of heap;
      # see loadtest/BASELINE.md (heap size capped WebSocket connections).
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75"
