services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: whatsapp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Backend waits until MySQL actually accepts connections, not just boots.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    ports:
      - "5454:5454"
    environment:
      SERVER_PORT: 5454
      # Reach MySQL by its compose service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/whatsapp?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_TIME: 86400000
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./FrontEnd/client
      args:
        REACT_APP_API_BASE_URL: http://localhost:5454
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
